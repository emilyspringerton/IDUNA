# iam.okemily.com — the real, dedicated IDUNA SSO domain. Founder real-time, 2026-09-24, same
# thread as the SSOLoginHandler itself (internal/http/handlers/sso_login.go): "instead of putting
# your password into page on wotan iduna needs to become the SSO" -> "iam.okemily.com make that
# the actual sso page just the login a nice modern SSO login that has like the 2 panes."
#
# Unlike every other *.okemily.com vhost that proxies to IDUNA (WOTAN/ops/nginx-wotan.conf,
# OKEMILY/ops/nginx-okemily.conf, console-okemily.conf), this one's whole point is that the
# browser's own address bar shows IDUNA's own domain while a password is typed -- a real
# cross-domain redirect, not the "same-origin proxy trick" every other caller uses. `/` is
# rewritten to the SSO login page itself so the dedicated domain's root IS the login screen
# (`https://iam.okemily.com/?redirect_uri=<caller's own return URL>`); `/api/v1/` is a plain
# proxy so that page's own JS can call /api/v1/auth/email/login and /register same-origin.
#
# DNS: iam.okemily.com does NOT resolve yet (checked live, 2026-09-24 -- unlike
# console.okemily.com, which was pre-provisioned before its own vhost landed). A Cloudflare A
# record (iam.okemily.com -> this host's IP, same target as wotan.okemily.com/okemily.com) needs
# to exist and propagate BEFORE running certbot below, or its HTTP-01 challenge will fail. Not
# created by this session -- the sandbox's own credential-leakage guard blocked an inline-token
# Cloudflare API call; see EMILY/BACKLOG.md SECTION 543 for the real, current status.
#
# Deploy (see sudo-queue/ for the matching numbered script), once DNS resolves:
#   sudo cp iam-okemily.conf /etc/nginx/sites-available/iam
#   sudo ln -sf /etc/nginx/sites-available/iam /etc/nginx/sites-enabled/iam
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d iam.okemily.com   # issues the cert, rewrites this file in place to
#                                              # add the "managed by Certbot" SSL block, same as
#                                              # every other *.okemily.com vhost here.

server {
    listen 80;
    listen [::]:80;
    server_name iam.okemily.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Root IS the login page -- SSOLoginHandler validates redirect_uri itself (allowlist,
    # SSO_ALLOWED_REDIRECT_HOSTS), this rewrite is just routing, not a security boundary.
    location = / {
        # No $is_args$args here on purpose (found live, 2026-09-24): proxy_pass with no URI
        # component already forwards the original query string automatically. Appending it into
        # the rewrite target too doubled it (nginx built ".../sso/login%3Fredirect_uri=...
        # ?redirect_uri=..."), which Go's own http.ServeMux then "fixed" with a 307 cleaned-path
        # redirect to an even more mangled URL -- a real, live-caught bug, not a hypothetical.
        rewrite ^ /api/v1/auth/sso/login break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The login page's own fetch() calls (email/login, email/register) -- same scope every other
    # site's /api/ proxy already exposes, nothing new opened up here.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
