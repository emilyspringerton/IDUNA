# console.okemily.com — dedicated, root-mounted host for NOCK's code-server (VS Code in the
# browser). Real reason this is a separate host, not a /admin/nock/code path under okemily.com's
# own server block (S486, corrected 2026-09-21): code-server's own server-side router only
# recognizes fixed ROOT-level paths (/, /_static/*, /stable-<hash>/static/*, ...) with no
# base-path/prefix support at all — confirmed live by hitting the real running instance both
# directly and through the old subpath proxy (root worked, identical nested paths under any
# prefix 404'd). Same class of bug this file's sibling okemily.com config already solved for
# newssite the same way (its own /news/ location comment: "root-relative links ... broke under
# this subpath proxy ... moved to its own subdomain").
#
# DNS: console.okemily.com already existed (A record -> this host, pre-provisioned, see Cloudflare
# zone) with no nginx vhost behind it until this file. No new DNS work needed.
#
# All auth happens in IDUNA's own Go process (RequireCookieAuth + iduna.admin, main.go's
# NOCK_CODE_SERVER_HOST-gated route) — this vhost is a dumb pass-through to 127.0.0.1:8080, same
# as every /admin/ location block in okemily.com's own config. WebSocket upgrade headers are
# required here (unlike the plain /admin/ or /api/ blocks) because the VS Code web client leans on
# long-lived WebSocket connections for its extension host / terminal / IntelliSense — omitting
# these would let the login page load while the actual editor silently failed to do anything
# useful once inside.
#
# Deploy (see sudo-queue/85-console-okemily-code-server.sh):
#   sudo cp console-okemily.conf /etc/nginx/sites-available/console
#   sudo ln -sf /etc/nginx/sites-available/console /etc/nginx/sites-enabled/console
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d console.okemily.com   # issues the cert, rewrites this file in place
#                                                  # to add the "managed by Certbot" SSL block,
#                                                  # same as every other *.okemily.com vhost here.

server {
    listen 80;
    listen [::]:80;
    server_name console.okemily.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
