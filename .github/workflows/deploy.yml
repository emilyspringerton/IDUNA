name: Deploy IDUNA to the IDUNA box

# IDUNA auto-deploy on the Vultr infra (GCP gone 2026-11-26). release.yml already builds and pushes
# ghcr.io/emilyspringerton/iduna:<short sha> on every push to main; this workflow runs when that one finishes green and
# tells the IDUNA box to switch to that tag. The deploy key (secret DEPLOY_SSH_KEY) is bound to a forced command and the
# only thing a client can pass it is an image tag (hex, nothing else); the receiver pulls the image, repoints the
# iduna service in /opt/iduna/compose.yml, waits for the container healthcheck, and puts the previous tag back on failure
# (WOTAN/ops/deploy/iduna-receive.sh; one-time wiring: WOTAN/ops/deploy/setup.sh and README.md).
on:
  workflow_run:
    workflows: ["Release (run-anywhere bundles)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (default: the short sha of main's head)"
        required: false

concurrency:
  group: iduna-box-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '137.220.58.252' }}
  # Pinned host key; if the box is rebuilt update it here or set the DEPLOY_KNOWN_HOSTS repo variable.
  DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS || '137.220.58.252 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIARM3eZ8ajNcpZ7NvzsZ5dRebidahMoClpUnjVI4L/0D' }}

jobs:
  deploy:
    # a manual run, or a Release run that succeeded (that is what pushed the image)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Ship to the IDUNA box
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(git rev-parse --short HEAD)}"
          echo "deploying ghcr.io/emilyspringerton/iduna:$tag"
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::DEPLOY_SSH_KEY secret is not set -- see WOTAN/ops/deploy/README.md"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 \
              "root@$DEPLOY_HOST" "$tag"
