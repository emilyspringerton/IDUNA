<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; font: 13px/1.4 system-ui, sans-serif; padding: 12px; background:#0b0b12; color:#e8e8f0; }
  h1 { font-size: 14px; margin: 0 0 8px; color:#ff5fa2; }
  button { width:100%; padding:8px; font:inherit; background:#20203a; color:#e8e8f0; border:1px solid #2a2a3d; border-radius:6px; cursor:pointer; }
  button:hover { border-color:#5fd3ff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  p.hint { color:#8a8aa0; font-size:11px; }
  #status { margin-top:8px; font-size:12px; }
  a { color:#5fd3ff; }
</style>
</head>
<body>
  <h1>MIXFORGE Cookie Exporter</h1>
  <p class="hint">Reads your youtube.com cookies via Chrome's own <code>cookies</code> API
    (needs no page open, no boundary to defeat) and uploads them to your own IDUNA instance so
    MIXFORGE's DJ-room server can get past YouTube's server-side bot detection.</p>
  <button id="go">Export &amp; upload to IDUNA</button>
  <div id="status"></div>
  <p class="hint"><a href="#" id="opts">Configure endpoint / token</a></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
