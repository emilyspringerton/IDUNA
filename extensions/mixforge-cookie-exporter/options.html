<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; padding: 20px; max-width: 480px; background:#0b0b12; color:#e8e8f0; }
  h1 { font-size: 16px; color:#ff5fa2; }
  label { display:block; margin-top: 12px; font-size: 12px; color:#8a8aa0; }
  input { width: 100%; padding: 6px; font: inherit; background:#20203a; color:#e8e8f0; border:1px solid #2a2a3d; border-radius:6px; }
  button { margin-top: 14px; padding: 8px 14px; font: inherit; background:#20203a; color:#e8e8f0; border:1px solid #2a2a3d; border-radius:6px; cursor:pointer; }
  #status { margin-top: 10px; font-size: 12px; color:#7dff9a; }
  p.hint { color:#8a8aa0; font-size: 12px; }
</style>
</head>
<body>
  <h1>MIXFORGE Cookie Exporter — settings</h1>
  <p class="hint">The upload token comes from <code>MIXFORGE/var/mixforge-secrets.env</code> on
    the server (<code>MIXFORGE_COOKIE_UPLOAD_TOKEN</code>) -- treat it as a real secret, whoever
    has it can overwrite the live cookies file.</p>
  <label>IDUNA endpoint<input id="endpoint" placeholder="https://okemily.com/api/v1/mixforge/cookies"></label>
  <label>Upload token<input id="token" type="password"></label>
  <button id="save">Save</button>
  <div id="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
