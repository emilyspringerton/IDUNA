# bundle.env (from packaging/bundle-defaults.conf; *.env is gitignored here) -- where a run-anywhere IDUNA keeps its files: inside this folder, never in the paths the production box
# uses (/home/fatbaby/...). RUN reads this first, then iduna.env, so anything here can be overridden there. Without
# these, IDUNA tries to create /home/fatbaby/IDUNA/var/nock-projects and stops on any other machine.
NOCK_DATA_DIR=var/nock-projects
NOCK_VIDEO_DIR=var/nock-videos
NOCK_ROBOTS_GIT_DIR=off
EMILY_BACKLOG_PATH=var/BACKLOG.md
DEADWEIGHT_DECK_LOG=var/deadweight/decks.ndjson
DEADWEIGHT_MATCH_LOG=var/deadweight/matches.ndjson
DEADWEIGHT_MODEL_GIT_DISABLED=1
BRAWLPIT_MODEL_GIT_DISABLED=1
SHANKPIT_MODEL_GIT_DISABLED=1
